; Ajustes de desempenho: o código fica num bind mount (OneDrive/Windows), onde cada stat de arquivo é caro.
opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=30000
; Edições em PHP levam até 60s para aparecer; para ver na hora: docker compose -p hotelconnect restart php
opcache.revalidate_freq=60
realpath_cache_size=4096K
realpath_cache_ttl=600
