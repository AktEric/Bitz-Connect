server {
    listen 80;
    server_name localhost;

    # Permite upload de vídeo (deve acompanhar upload_max_filesize/post_max_size do PHP)
    client_max_body_size 205M;

    # Backend API — todas as rotas /api vão para o PHP-FPM via fastcgi
    location /api {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param REQUEST_URI     $request_uri;
        fastcgi_param DOCUMENT_ROOT   /var/www/html/public;
        include fastcgi_params;
    }

    # Storage — serve static files from Laravel storage symlink
    location /storage {
        alias /var/www/html/public/storage;
        try_files $uri $uri/ =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Frontend: build de produção (frontend/dist) servido direto pelo nginx.
    # Para desenvolver com HMR use o Vite em http://localhost:9599.
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Arquivos com hash no nome: cache de 1 ano
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: index.html nunca fica em cache, para pegar sempre o build novo
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

# Acesso direto à API na porta 8000 (sem frontend)
server {
    listen 8000;
    server_name localhost;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 205M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Storage files
    location /storage {
        alias /var/www/html/public/storage;
        try_files $uri $uri/ =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location ~ \.php$ {
        fastcgi_pass  php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }
}
