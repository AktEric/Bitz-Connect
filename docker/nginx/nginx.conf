server {
    listen 80;
    server_name localhost;

    # Permite upload de vídeo (deve acompanhar upload_max_filesize/post_max_size do PHP)
    client_max_body_size 205M;

    # Backend API — todas as rotas /api vão para o PHP-FPM via fastcgi
    location /api {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param REQUEST_URI     $request_uri;
        fastcgi_param DOCUMENT_ROOT   /var/www/html/public;
        include fastcgi_params;
    }

    # Storage — serve static files from Laravel storage symlink
    location /storage {
        alias /var/www/html/public/storage;
        try_files $uri $uri/ =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Frontend (React SPA via Vite dev server) — tudo o mais
    location / {
        proxy_pass http://node:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }
}

# Acesso direto à API na porta 8000 (sem frontend)
server {
    listen 8000;
    server_name localhost;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 205M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Storage files
    location /storage {
        alias /var/www/html/public/storage;
        try_files $uri $uri/ =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location ~ \.php$ {
        fastcgi_pass  php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }
}
