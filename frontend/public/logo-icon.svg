<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="hc-bg" x1="6" y1="6" x2="114" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#431BFF" />
      <stop offset="1" stop-color="#7C3AED" />
    </linearGradient>
    <clipPath id="hc-leftleg-clip">
      <rect x="28" y="22" width="18" height="76" rx="9" />
    </clipPath>
  </defs>

  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#hc-bg)" />

  <!-- left leg -->
  <rect x="28" y="22" width="18" height="76" rx="9" fill="#ffffff" />
  <!-- diagonal highlight over left leg -->
  <g clip-path="url(#hc-leftleg-clip)">
    <rect x="16" y="52" width="60" height="14" rx="4" fill="#ffffff" opacity="0.28" transform="rotate(-32 46 60)" />
  </g>

  <!-- crossbar -->
  <rect x="46" y="52" width="28" height="16" rx="8" fill="#ffffff" />

  <!-- right leg: person silhouette -->
  <circle cx="80" cy="34" r="12" fill="#ffffff" />
  <rect x="68" y="46" width="24" height="52" rx="12" fill="#ffffff" />
</svg>
