<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="ch-stem" x1="28" y1="22" x2="46" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C5CE8" />
      <stop offset="1" stop-color="#4D14D9" />
    </linearGradient>
    <linearGradient id="ch-person" x1="68" y1="22" x2="92" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B6BF5" />
      <stop offset="1" stop-color="#9B82F7" />
    </linearGradient>
    <clipPath id="ch-stem-clip">
      <rect x="28" y="22" width="18" height="76" rx="9" />
    </clipPath>
  </defs>

  <!-- left leg + crossbar -->
  <rect x="28" y="22" width="18" height="76" rx="9" fill="url(#ch-stem)" />
  <rect x="46" y="52" width="28" height="16" rx="8" fill="url(#ch-stem)" />
  <!-- diagonal highlight over left leg -->
  <g clip-path="url(#ch-stem-clip)">
    <rect x="10" y="50" width="70" height="16" rx="4" fill="#8B6BF5" opacity="0.55" transform="rotate(-38 46 58)" />
  </g>

  <!-- right leg: person silhouette (light purple) -->
  <circle cx="80" cy="34" r="12" fill="url(#ch-person)" />
  <rect x="68" y="46" width="24" height="52" rx="12" fill="url(#ch-person)" />
</svg>
